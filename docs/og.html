<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(120% 90% at 50% 0%,#0d6e6e,#0a5757);display:flex;align-items:center;justify-content:center}
.w{width:1080px;background:#d7d3cb;padding:44px 40px 34px;position:relative;
  border:3px solid;border-color:#fffefb #3f3b36 #3f3b36 #fffefb;box-shadow:10px 10px 0 rgba(0,0,0,.25)}
.tb{position:absolute;left:4px;right:4px;top:4px;height:34px;display:flex;align-items:center;padding:0 12px;
  background:linear-gradient(90deg,#1b1b6e,#3d7fc4);color:#fff;font:700 15px/1 inherit}
.tb .btns{margin-left:auto;font:700 12px/1 ui-monospace,monospace;letter-spacing:.34em;
  background:#d7d3cb;color:#151311;padding:5px 8px;border:1px solid;border-color:#fffefb #3f3b36 #3f3b36 #fffefb}
.row{display:flex;gap:26px;align-items:center}
h1{font-size:52px;line-height:1.04;letter-spacing:-.025em;color:#151311;font-weight:800}
p{color:#4b4640;font-size:21px;margin-top:12px;line-height:1.4}
.screen{margin-top:24px;height:262px;position:relative;overflow:hidden;background:linear-gradient(150deg,#2a2320,#141a22 55%,#1d1512);
  border:3px solid;border-color:#3f3b36 #fffefb #fffefb #3f3b36}
.mb{height:26px;background:rgba(10,9,8,.7);display:flex;align-items:center;gap:18px;padding:0 12px;
  font:600 12px/1 inherit;color:#cfc6bd}
.mb .r{margin-left:auto;display:flex;gap:12px;align-items:center}
.screen canvas{position:absolute;image-rendering:pixelated}
#mark{flex:none;image-rendering:pixelated}
.tag{position:absolute;transform:translateX(-50%);white-space:nowrap;font:700 11px/1 inherit;color:#fff;
  background:rgba(0,0,0,.5);padding:3px 7px;border-radius:4px}
.bub{position:absolute;transform:translateX(-50%);white-space:nowrap;font:600 12px/1 inherit;color:#1a1a18;
  background:#f6f1e8;padding:5px 9px;border-radius:5px}
.foot{margin-top:18px;display:flex;align-items:center;gap:14px;color:#6f6960;font:600 16px/1 inherit}
.pill{background:#b4441c;color:#fff;padding:8px 16px;font-weight:800;font-size:17px;
  border:2px solid;border-color:#e08a6a #6d2a10 #6d2a10 #e08a6a}
</style></head><body>
<div class="w">
  <div class="tb">Claudme.exe<span class="btns">_ □ ✕</span></div>
  <div class="row">
    <canvas id="mark" width="220" height="230" style="width:110px;height:115px"></canvas>
    <div><h1>Your AI agents are<br>a crime family</h1>
    <p>One pixel crab per Claude Code session, crawling the edges of your screen.</p></div>
  </div>
  <div class="screen" id="scr">
    <div class="mb"><b>Claudme</b><span>File</span><span>Edit</span><span>View</span><span class="r"><span>🦀 5</span><span>Wed 02:14</span></span></div>
  </div>
  <div class="foot"><span class="pill">Free · macOS · MIT</span>
    <span>marekadvocate.github.io/claudme</span></div>
</div>
<script>
const CRAB='#c2673f', HAT='#3b3532', EYE='#141110', PX=4;
const shell=[]; for(let x=1;x<=9;x++){shell.push([x,0]);shell.push([x,1]);}
for(let x=0;x<=10;x++) shell.push([x,2]);
for(let x=0;x<=10;x++) if(x!==2&&x!==8) shell.push([x,3]);
const legs=[[1,4],[3,4],[7,4],[9,4],[1,5],[3,5],[7,5],[9,5]];
const hat=[[4,-3],[6,-3],[3,-2],[4,-2],[5,-2],[6,-2],[7,-2],[1,-1],[2,-1],[3,-1],[4,-1],[5,-1],[6,-1],[7,-1],[8,-1],[9,-1]];
const eyes=[[2,3],[8,3]];
function flat(cv,col,px){const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);
  const put=(cells,c)=>{g.fillStyle=c;for(const [x,y] of cells) g.fillRect(x*px,(y+3)*px,px,px);};
  put(shell,col);put(legs,col);put(hat,HAT);put(eyes,EYE);}
// hero mark: isometric, matching the app icon
(function(){const cv=document.getElementById('mark'),g=cv.getContext('2d'),px=13,D=3,hw=px,hh=px/2;
 const cells=[[shell,CRAB],[legs,CRAB],[hat,HAT],[eyes,EYE]];const faces=[];
 const sh=(hex,f)=>{const n=parseInt(hex.slice(1),16),m=v=>Math.min(255,Math.round(v*f));
   return `rgb(${m(n>>16&255)},${m(n>>8&255)},${m(n&255)})`;};
 for(const [set,col] of cells) for(const [c,r] of set) for(let y=0;y<D;y++){
   const X=c,Y=y,Z=-r; const sx=(X-Y)*hw, sy=(X+Y)*hh - Z*px;
   faces.push({d:X+Y+Z,sx,sy,col});}
 faces.sort((a,b)=>a.d-b.d);
 let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
 for(const f of faces){minx=Math.min(minx,f.sx-hw);maxx=Math.max(maxx,f.sx+hw);
   miny=Math.min(miny,f.sy-px);maxy=Math.max(maxy,f.sy+px+hh);}
 const ox=(cv.width-(maxx-minx))/2-minx, oy=(cv.height-(maxy-miny))/2-miny;
 for(const f of faces){const x=f.sx+ox,y=f.sy+oy;
   g.fillStyle=sh(f.col,1.0);g.beginPath();g.moveTo(x,y-hh);g.lineTo(x+hw,y);g.lineTo(x,y+hh);g.lineTo(x-hw,y);g.closePath();g.fill();
   g.fillStyle=sh(f.col,.72);g.beginPath();g.moveTo(x-hw,y);g.lineTo(x,y+hh);g.lineTo(x,y+hh+px);g.lineTo(x-hw,y+px);g.closePath();g.fill();
   g.fillStyle=sh(f.col,.55);g.beginPath();g.moveTo(x+hw,y);g.lineTo(x,y+hh);g.lineTo(x,y+hh+px);g.lineTo(x+hw,y+px);g.closePath();g.fill();}
})();
// crabs on the simulated screen edges
const scr=document.getElementById('scr');
const crew=[['Don Vito Opus','#7aa7d8',60,'bottom'],['Capo Kenji Fable','#7fc08a',300,'bottom'],
            ['Soldato Marcus Haiku','#e0a13c',600,'bottom'],['Picciotto Nyx Sonnet','#b184d8',860,'bottom'],
            ['Don Lorenzo Opus','#d97757',420,'top']];
for(const [name,col,x,edge] of crew){
  const cv=document.createElement('canvas');cv.width=11*PX;cv.height=9*PX;
  cv.style.left=x+'px';
  cv.style[edge==='top'?'top':'bottom']= edge==='top' ? '26px' : '6px';
  if(edge==='top') cv.style.transform='rotate(180deg)';
  flat(cv,col,PX);scr.appendChild(cv);
  const t=document.createElement('div');t.className='tag';t.textContent=name;
  t.style.left=(x+22)+'px'; t.style[edge==='top'?'top':'bottom']= edge==='top'?'62px':'46px';
  scr.appendChild(t);
}
const b=document.createElement('div');b.className='bub';b.textContent="It's done, boss.";
b.style.left='86px';b.style.bottom='78px';scr.appendChild(b);
</script></body></html>
