# GitHub's legacy Pages builder repeatedly failed to acquire a runner
# ("The job was not acquired by Runner of type hosted"), which left the site stuck on an
# old commit. This publishes docs/ through the normal Actions runners instead.
name: Deploy site

on:
  push:
    branches: [master]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
